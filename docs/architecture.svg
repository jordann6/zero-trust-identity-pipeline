<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Azure Zero Trust Identity Pipeline - Architecture</title>
<desc>Four-layer architecture: Entra ID identity plane, workload security, threat detection, and incident response and alerting.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  text { font-family: system-ui, -apple-system, sans-serif; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .section-label { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
</defs>

<!-- Entra ID container -->
<rect x="40" y="40" width="600" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="56" y="58" dominant-baseline="central" fill="#3C3489">Microsoft Entra ID</text>

<!-- Users & groups -->
<rect x="60" y="76" width="170" height="60" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="145" y="97" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Users &amp; groups</text>
<text class="ts" x="145" y="117" text-anchor="middle" dominant-baseline="central" fill="#444441">3 users · 1 security group</text>

<!-- App registration -->
<rect x="255" y="76" width="170" height="60" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="97" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">App registration</text>
<text class="ts" x="340" y="117" text-anchor="middle" dominant-baseline="central" fill="#444441">Graph API · RBAC</text>

<!-- Managed identity -->
<rect x="450" y="76" width="170" height="60" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="535" y="97" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Managed identity</text>
<text class="ts" x="535" y="117" text-anchor="middle" dominant-baseline="central" fill="#444441">No secrets · RBAC</text>

<!-- Arrow 1 -->
<line x1="340" y1="154" x2="340" y2="170" class="arr" marker-end="url(#arrow)"/>

<!-- Workload security label -->
<text class="section-label" x="50" y="182" dominant-baseline="central">Workload security</text>

<!-- Key Vault -->
<rect x="50" y="190" width="180" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="140" y="211" text-anchor="middle" dominant-baseline="central" fill="#085041">Key Vault</text>
<text class="ts" x="140" y="231" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">RBAC · secrets · audit logs</text>

<!-- Storage account -->
<rect x="250" y="190" width="180" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="211" text-anchor="middle" dominant-baseline="central" fill="#085041">Storage account</text>
<text class="ts" x="340" y="231" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">No shared keys</text>

<!-- GitHub OIDC -->
<rect x="450" y="190" width="180" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="540" y="211" text-anchor="middle" dominant-baseline="central" fill="#085041">GitHub OIDC</text>
<text class="ts" x="540" y="231" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Federated credential</text>

<!-- Arrow 2 -->
<line x1="340" y1="252" x2="340" y2="268" class="arr" marker-end="url(#arrow)"/>

<!-- Threat detection label -->
<text class="section-label" x="50" y="278" dominant-baseline="central">Threat detection</text>

<!-- Defender for Cloud -->
<rect x="50" y="286" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="140" y="307" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Defender for Cloud</text>
<text class="ts" x="140" y="327" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Standard tier plans</text>

<!-- Log Analytics -->
<rect x="250" y="286" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="307" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Log Analytics</text>
<text class="ts" x="340" y="327" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Sentinel workspace</text>

<!-- Microsoft Sentinel -->
<rect x="450" y="286" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="540" y="307" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Microsoft Sentinel</text>
<text class="ts" x="540" y="327" text-anchor="middle" dominant-baseline="central" fill="#185FA5">5 MITRE-mapped rules</text>

<!-- Arrow 3 -->
<line x1="340" y1="348" x2="340" y2="364" class="arr" marker-end="url(#arrow)"/>

<!-- Response label -->
<text class="section-label" x="50" y="374" dominant-baseline="central">Response &amp; alerting</text>

<!-- Logic App -->
<rect x="50" y="382" width="180" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="140" y="403" text-anchor="middle" dominant-baseline="central" fill="#712B13">Logic App</text>
<text class="ts" x="140" y="423" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Incident playbook</text>

<!-- Monitor alerts -->
<rect x="250" y="382" width="180" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="340" y="403" text-anchor="middle" dominant-baseline="central" fill="#712B13">Monitor alerts</text>
<text class="ts" x="340" y="423" text-anchor="middle" dominant-baseline="central" fill="#993C1D">4 activity log alerts</text>

<!-- Action group -->
<rect x="450" y="382" width="180" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="540" y="403" text-anchor="middle" dominant-baseline="central" fill="#712B13">Action group</text>
<text class="ts" x="540" y="423" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Email · webhook</text>
</svg>
